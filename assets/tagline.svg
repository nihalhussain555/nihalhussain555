<svg xmlns="http://www.w3.org/2000/svg" width="760" height="92" viewBox="0 0 760 92" role="img" aria-label="Building intelligent systems. Creating meaningful impact.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="760" height="92" rx="14" fill="url(#bg)"/>
<rect x=".8" y=".8" width="758" height="90" rx="14" fill="none" stroke="#1e293b" stroke-width="1.6"/>
<text x="380.0" y="52" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.2" fill="url(#num)">Building intelligent systems.</text>
<text x="380.0" y="78" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="4.2" fill="#8b949e">CREATING MEANINGFUL IMPACT</text>
<rect x="290.0" y="14" width="180" height="2" fill="url(#gr)" opacity=".85"/>
<circle r="3" fill="#67e8f9" filter="url(#soft)"><animateMotion dur="8s" repeatCount="indefinite" path="M290.0 15 H470.0"/><animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/></circle>
</svg>