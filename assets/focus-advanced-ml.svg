<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" role="img" aria-label="Advanced ML — currently learning">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#8b5cf6" stop-opacity=".7"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="300" height="150" rx="14" fill="url(#bg)"/>
<rect x=".8" y=".8" width="298" height="148" rx="14" fill="none" stroke="#1e293b" stroke-width="1.6"/>
<rect x="18" y="14" width="58" height="3" rx="1.5" fill="url(#gr)"/>
<path d="M22 90 L22 58 M22 90 L62 90" stroke="#06b6d4" stroke-width="1.4" fill="none" opacity=".7"/>
<path d="M24 86 C 36 60, 48 78, 60 60" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-dasharray="60"><animate attributeName="stroke-dashoffset" values="60;-60" dur="5s" repeatCount="indefinite"/></path>
<circle cx="60" cy="60" r="3" fill="#67e8f9" filter="url(#soft)"/>
<g font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<text x="82" y="72" font-size="17" font-weight="700" fill="#e6edf7">Advanced ML</text>
<text x="82" y="92" font-size="11.5" letter-spacing="1.1" fill="#8b949e">Model design &amp; evaluation</text></g>
<text x="282" y="134" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="9.5" letter-spacing="2.2" fill="#475569">LEARNING</text>
</svg>